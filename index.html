<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>PCB SP | Recrutamento e Circulismo</title>

  <meta name="theme-color" content="#c90c14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="PCB SP">

  <link rel="icon"
        type="image/png"
        href="./icone-recrutamento.png">

  <link rel="apple-touch-icon"
        href="./icone-recrutamento.png">

  <link rel="manifest"
        href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #c90c14;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 90%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.25);
    }

    .logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
      color: #c90c14;
    }

    p {
      margin: 0 0 22px;
      font-size: 16px;
      line-height: 1.45;
      color: #444;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: #c90c14;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }

    /* Tela de abertura do aplicativo */
    body.app-mode .box {
      background: transparent;
      box-shadow: none;
    }

    body.app-mode .logo {
      width: 170px;
      height: 170px;
      margin-bottom: 20px;
    }

    body.app-mode h1 {
      color: #ffffff;
      font-size: 30px;
    }

    body.app-mode p {
      color: #ffffff;
      font-size: 18px;
    }

    body.app-mode .btn {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      class="logo"
      src="./icone-recrutamento.png"
      alt="PCB SP">

    <h1>PCB SP</h1>

    <p>
      Recrutamento e Circulismo
    </p>

    <a
      class="btn"
      href="https://script.google.com/macros/s/AKfycbxX32EywSxmIoUIHgIEF0Xsv9Ed9TZhHhKE2ObPolExAnrxKrHwXkim9ufx5eVET4em/exec">
      ENTRAR NO APLICATIVO
    </a>

  </div>

  <script>
    const appInstalado =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (appInstalado) {

      // Modo aplicativo: transforma a página em tela de abertura
      document.body.classList.add('app-mode');

      // Depois abre automaticamente o aplicativo real
      setTimeout(function () {
        window.location.replace(
          "https://script.google.com/macros/s/AKfycbxX32EywSxmIoUIHgIEF0Xsv9Ed9TZhHhKE2ObPolExAnrxKrHwXkim9ufx5eVET4em/exec"
        );
      }, 900);

    }
  </script>

</body>
</html>
