<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>PCB SP | Recrutamento e Circulismo</title>

  <meta name="theme-color" content="#c90c14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="PCB SP">

  <link rel="icon"
        type="image/png"
        href="./icone-recrutamento.png">

  <link rel="apple-touch-icon"
        href="./icone-recrutamento.png">

  <link rel="manifest"
        href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #c90c14;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.25);
    }

    .logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      color: #c90c14;
    }

    .subtitulo {
      margin: 0 0 25px;
      font-size: 18px;
      line-height: 1.4;
      color: #444444;
    }

    .instrucao {
      margin: 0 0 20px;
      padding: 14px;
      background: #f3f3f3;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
      color: #333333;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: #c90c14;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      class="logo"
      src="./icone-recrutamento.png"
      alt="PCB SP">

    <h1>PCB SP</h1>

    <p class="subtitulo">
      Recrutamento e Circulismo
    </p>

    <div class="instrucao">
      Para instalar no celular, abra o menu
      <strong>⋮</strong> do Chrome e escolha
      <strong>Instalar app</strong>.
    </div>

    <a
      class="btn"
      href="https://script.google.com/macros/s/AKfycbxX32EywSxmIoUIHgIEF0Xsv9Ed9TZhHhKE2ObPolExAnrxKrHwXkim9ufx5eVET4em/exec">
      ENTRAR NO APLICATIVO
    </a>

  </div>

</body>
</html>
